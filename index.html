<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTEC Sport & Exercise Physiology - Revision Guide</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .header-section {
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .student-info {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            font-weight: bold;
        }
        .student-info input {
            padding: 8px;
            font-size: 1em;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-check { background-color: #3498db; color: white; }
        .btn-check:hover { background-color: #2980b9; }
        .btn-download { background-color: #2ecc71; color: white; }
        .btn-download:hover { background-color: #27ae60; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-clear:hover { background-color: #c0392b; }
        
        .section-container {
            margin-bottom: 40px;
        }
        .question-block {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }
        .mark-scheme {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f6f3;
            border-left: 4px solid #1abc9c;
            display: none; /* Hidden by default */
        }
        .mark-scheme.visible {
            display: block;
        }
        .save-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f39c12;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* Print/Download styles */
        @media print {
            .controls, .save-indicator { display: none !important; }
            body { background: white; }
            .container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container" id="export-content">
    <div class="header-section">
        <h1>BTEC Sports Science Extended Diploma Year 2</h1>
        <h2>UNIT 1 – SPORT & EXERCISE PHYSIOLOGY</h2>
        <h3>UNIT CONTENT A - Acute Responses to Exercise</h3>
        <p><i>Your work saves automatically. Acceptable alternative phrasings and close spelling attempts are permitted when self-marking.</i></p>
    </div>

    <div class="student-info">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your full name">
    </div>

    <div class="controls" data-html2canvas-ignore="true">
        <button class="btn-check" onclick="toggleMarkScheme()" id="checkBtn">Mark My Answers</button>
        <button class="btn-download" onclick="downloadDoc()">Download as Word/Google Doc</button>
        <button class="btn-clear" onclick="clearData()">Clear All Data</button>
    </div>

    <div id="quiz-container">
        <!-- Content will be generated by JavaScript -->
    </div>
</div>

<div class="save-indicator" id="saveIndicator">Progress Saved!</div>

<script>
    // Data structure containing all questions and mark scheme answers
    const quizData = [
        {
            title: "Section 1: Skeletal System",
            questions: [
                { q: "During bone remodelling, which cells are responsible for destroying older bone?", a: "Osteoclasts.[cite: 1]" },
                { q: "What specific force stimulates increased osteoblast activity to develop new bone during weight-bearing exercise?", a: "The pulling forces exerted by the muscle on the bone.[cite: 1]" },
                { q: "Identify two acute responses of synovial fluid to exercise.", a: "Increased production of synovial fluid, reduction in viscosity (becomes thinner), lubricates joints/protects bones, or provides increased nutrients. (Any two).[cite: 1]" },
                { q: "What percentage of the body's calcium is stored in the skeleton?", a: "Approximately 99%.[cite: 1]" },
                { q: "Which mineral actively aids in the maturation and function of osteocytes?", a: "Phosphorus (as phosphate).[cite: 1]" }
            ]
        },
        {
            title: "Section 2: Muscular System",
            questions: [
                { q: "What is the specific pattern of muscle fibre recruitment called?", a: "The Ramping Effect.[cite: 1]" },
                { q: "State the correct order of muscle fibre recruitment as intensity increases.", a: "Type I, then Type IIa, then Type IIx.[cite: 1]" },
                { q: "Why are Type I fibres best suited for low intensity, long duration endurance work?", a: "They have a slower contraction time and are slow to fatigue due to greater numbers of capillaries / better oxygen delivery.[cite: 1]" },
                { q: "What is the Vascular Shunting Mechanism (VSM)?", a: "The diversion/redistribution of blood from nonessential organs to the working muscles.[cite: 1]" },
                { q: "Which part of the brain activates the shunt mechanism?", a: "The vasomotor center (VMC) / medulla oblongata.[cite: 1]" },
                { q: "During exercise, what happens to the arterioles supplying non-vital organs compared to working muscles?", a: "Arterioles to non-vital organs constrict (vasoconstriction), while arterioles to working muscles dilate (vasodilation).[cite: 1]" },
                { q: "What causes micro-tears in muscle fibres, and how does the body repair them?", a: "Repeated contraction and relaxation creates stress/overload. Rest and proteins are used to heal and fill the gaps.[cite: 1]" },
                { q: "Explain how an increase in muscle temperature during a warm-up reduces the risk of injury.", a: "As temperature increases, the pliability and flexibility of the muscles increase, reducing injury risk.[cite: 1]" }
            ]
        },
        {
            title: "Section 3: Respiratory System",
            questions: [
                { q: "Which specific part of the brain acts as the respiratory control centre?", a: "The medulla oblongata.[cite: 1]" },
                { q: "Chemoreceptors detect changes in three main chemical levels in the blood. What are they?", a: "Oxygen, carbon dioxide, and acidity (pH) levels.[cite: 1]" },
                { q: "Provide the equation for Minute Volume / Ventilation (VE).", a: "VE = TV (Tidal Volume) x F (Frequency/Respiratory Rate).[cite: 1]" },
                { q: "What hormones are responsible for the 'Anticipatory Rise' in breathing rate before exercise begins?", a: "Adrenaline and noradrenaline.[cite: 1]" },
                { q: "Inspiration is an active process. Name two accessory muscles that aid inspiration during exercise.", a: "Scalene, Sternocleidomastoids, or Pectoralis minor. (Any two).[cite: 1]" },
                { q: "Expiration is passive at rest. Which muscles contract to make it an active process during exercise?", a: "Internal intercostal muscles, abdominals, and latissimus dorsi.[cite: 1]" },
                { q: "The Oxyhaemoglobin Dissociation Curve shifts to the right during exercise. What is this effect called?", a: "The Bohr Effect (or Bohr Shift).[cite: 1]" },
                { q: "List three factors that cause the shift in the curve mentioned above.", a: "Increased CO2, increased lactic acid, increased blood acidity (reduced pH), increased blood/muscle temperature. (Any three).[cite: 1]" }
            ]
        },
        {
            title: "Section 4: Cardiovascular System",
            questions: [
                { q: "Define Cardiac Output (Q) and provide the formula used to calculate it.", a: "The amount of blood which leaves the heart every minute. Formula: CO = HR x SV.[cite: 1]" },
                { q: "Which branch of the autonomic nervous system is initiated to increase heart rate during exercise?", a: "The sympathetic nervous system.[cite: 1]" },
                { q: "Why does Stroke Volume (SV) plateau when exercise intensity exceeds 50-60% of max HR?", a: "The increase in HR does not allow enough time for the heart to fill completely.[cite: 1]" },
                { q: "Explain Starlings Law of the heart in relation to Venous Return and Stroke Volume.", a: "The heart can only pump out what it receives. The more blood (venous return), the greater the stretch of muscle fibres, resulting in a more forceful contraction.[cite: 1]" },
                { q: "What happens to Systolic and Diastolic blood pressure during cardiovascular exercise?", a: "Systolic blood pressure increases; Diastolic blood pressure reduces slightly or stays the same.[cite: 1]" },
                { q: "What does Arteriovenous Oxygen Difference (a-VO2 diff) measure, and why does it increase during exercise?", a: "It measures the difference in oxygen content between arterial and venous blood. It increases because working muscles demand and extract more oxygen from arterial blood.[cite: 1]" }
            ]
        },
        {
            title: "Section 5: Nervous & Endocrine Systems",
            questions: [
                { q: "What two components make up a motor unit?", a: "A motor neuron and the muscle fibres it stimulates.[cite: 1]" },
                { q: "What is the specific function of Muscle Spindles?", a: "They detect muscle stretch (velocity and degree) and initiate a reflex that resists the stretch to prevent tears.[cite: 1]" },
                { q: "Where are Baroreceptors located, and what do they detect?", a: "Located in the blood vessels; they detect changes in blood pressure.[cite: 1]" },
                { q: "Which hormone is known as a catabolic steroid hormone that is associated with stress and increases blood sugar levels?", a: "Cortisol.[cite: 1]" },
                { q: "What is the role of Human Growth Hormone (HGH) during exercise?", a: "Stimulates body/bone growth, mobilizes free fatty acids, maintains blood glucose, and stimulates protein synthesis.[cite: 1]" }
            ]
        },
        {
            title: "Section 6: The Energy Systems",
            questions: [
                { q: "What is the only molecule that provides energy that we can use for muscular contraction?", a: "ATP (Adenosine Triphosphate).[cite: 1]" },
                { q: "For the ATP-PC System: What enzyme controls the breakdown of PC, and roughly how long does this system last?", a: "Enzyme: Creatine Kinase. Duration: Up to 10 seconds.[cite: 1]" },
                { q: "What is the fatiguing waste product of the Lactic Acid system, and how many ATP does it provide per glucose molecule?", a: "Waste product: Lactic acid. Yield: 2 ATP per glucose.[cite: 1]" },
                { q: "In the Aerobic System, what is the total ATP yield for every molecule of glycogen/glucose?", a: "38 ATP.[cite: 1]" },
                { q: "What is the Energy Continuum concept?", a: "All three energy systems are used all the time, but the predominant system depends on the intensity and duration of the activity.[cite: 1]" }
            ]
        }
    ];

    let questionCounter = 1;
    const container = document.getElementById('quiz-container');

    // Generate HTML content dynamically
    quizData.forEach((section, secIndex) => {
        let sectionHTML = `<div class="section-container"><h2>${section.title}</h2>`;
        
        section.questions.forEach((item, qIndex) => {
            const inputId = `q_${secIndex}_${qIndex}`;
            sectionHTML += `
                <div class="question-block">
                    <div class="question-text">${questionCounter}. ${item.q}</div>
                    <textarea id="${inputId}" class="answer-input" placeholder="Type your answer here..."></textarea>
                    <div class="mark-scheme">
                        <strong>Mark Scheme Answer:</strong> ${item.a}
                    </div>
                </div>
            `;
            questionCounter++;
        });
        
        sectionHTML += `</div>`;
        container.innerHTML += sectionHTML;
    });

    // Handle Auto-saving to LocalStorage
    let saveTimeout;
    const saveIndicator = document.getElementById('saveIndicator');
    
    // Load Name
    const nameInput = document.getElementById('studentName');
    nameInput.value = localStorage.getItem('btec_student_name') || '';
    nameInput.addEventListener('input', () => {
        localStorage.setItem('btec_student_name', nameInput.value);
        showSaveIndicator();
    });

    // Load Answers
    const textareas = document.querySelectorAll('.answer-input');
    textareas.forEach(ta => {
        ta.value = localStorage.getItem(`btec_answer_${ta.id}`) || '';
        ta.addEventListener('input', () => {
            localStorage.setItem(`btec_answer_${ta.id}`, ta.value);
            showSaveIndicator();
        });
    });

    function showSaveIndicator() {
        clearTimeout(saveTimeout);
        saveIndicator.style.display = 'block';
        saveTimeout = setTimeout(() => {
            saveIndicator.style.display = 'none';
        }, 2000);
    }

    // Toggle Mark Scheme Visibility
    let markingVisible = false;
    function toggleMarkScheme() {
        markingVisible = !markingVisible;
        const markSchemes = document.querySelectorAll('.mark-scheme');
        const btn = document.getElementById('checkBtn');
        
        markSchemes.forEach(el => {
            if(markingVisible) {
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        });
        
        btn.textContent = markingVisible ? "Hide Mark Scheme" : "Mark My Answers";
    }

    // Download as Word Document (.doc format)
    function downloadDoc() {
        // Prepare HTML for Word Document export
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Revision Guide</title></head><body>";
        const footer = "</body></html>";
        
        // Clone the content so we don't break the UI
        const exportContent = document.getElementById('export-content').cloneNode(true);
        
        // Remove buttons
        const controls = exportContent.querySelector('.controls');
        if(controls) controls.remove();

        // Convert Textareas to normal paragraph text so they display correctly in Word
        const textareas = exportContent.querySelectorAll('textarea');
        textareas.forEach(ta => {
            const p = document.createElement('p');
            p.style.border = "1px solid #000";
            p.style.padding = "10px";
            p.style.backgroundColor = "#f5f5f5";
            p.innerText = "Student Answer: " + (ta.value ? ta.value : "[No answer provided]");
            ta.parentNode.replaceChild(p, ta);
        });

        // Ensure Mark Scheme is visible in download
        const markSchemes = exportContent.querySelectorAll('.mark-scheme');
        markSchemes.forEach(ms => {
            ms.style.display = 'block';
            ms.style.borderLeft = '4px solid #1abc9c';
            ms.style.padding = '10px';
            ms.style.backgroundColor = '#e8f6f3';
        });

        const html = header + exportContent.innerHTML + footer;
        
        const blob = new Blob(['\ufeff', html], {
            type: 'application/msword'
        });
        
        // Create download link
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        
        // Use the student's name in the filename if provided
        const studentName = document.getElementById('studentName').value.trim() || 'Student';
        link.download = `BTEC_Unit1A_Revision_${studentName}.doc`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Clear all saved data
    function clearData() {
        if(confirm("Are you sure you want to delete all your answers? This cannot be undone.")) {
            localStorage.clear();
            window.location.reload();
        }
    }
</script>
</body>
</html>
